<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vụ Lúa - Tài khoản</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:460px;margin:0 auto;padding:28px 18px;font-size:18px;line-height:1.55;color:#1b1b1b}
  h1{font-size:1.5rem;color:#2e7d32}
  input,button{font-size:1.1rem;width:100%;box-sizing:border-box;padding:14px;margin-top:12px;border-radius:10px}
  input{border:1px solid #888}
  button{background:#2e7d32;color:#fff;border:0;font-weight:600}
  button:disabled{opacity:.6}
  .ok{color:#1b5e20;font-weight:600}.err{color:#b71c1c;font-weight:600}
  [hidden]{display:none!important}
  @media (prefers-color-scheme:dark){body{background:#121212;color:#e8e8e8}input{background:#1e1e1e;color:#fff}h1{color:#81c784}.ok{color:#a5d6a7}.err{color:#ef9a9a}}
</style>
</head>
<body>
<h1>Vụ Lúa</h1>
<p id="msg">Đang xử lý...</p>

<form id="form" hidden>
  <label for="pw">Mật khẩu mới (ít nhất 6 ký tự)</label>
  <input id="pw" type="password" minlength="6" autocomplete="new-password" required>
  <button id="btn" type="submit">Đổi mật khẩu</button>
</form>

<script>
/* ĐIỀN HAI GIÁ TRỊ NÀY (khóa anon/publishable là khóa công khai, được phép để trong trang web).
   TUYỆT ĐỐI không điền khóa service_role. */
var SUPABASE_URL = "https://bovbkmukbrgjlkclovki.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvdmJrbXVrYnJnamxrY2xvdmtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNDcyMTgsImV4cCI6MjEwOTYyMzIxOH0.azfmqKbJ5W70ZPYVkesSZel6OhZLlUxJRYQskUjgEk4";

var msg = document.getElementById("msg");
var form = document.getElementById("form");
function say(text, cls) { msg.textContent = text; msg.className = cls || ""; }

// Supabase gắn kết quả vào phần sau dấu # của địa chỉ.
var params = new URLSearchParams(location.hash.replace(/^#/, ""));
var token = params.get("access_token");
var type = params.get("type");
var error = params.get("error_description") || params.get("error");

if (error) {
  say("Liên kết không dùng được hoặc đã hết hạn. Hãy quay lại ứng dụng và gửi lại email.", "err");
} else if (type === "recovery" && token) {
  say("Nhập mật khẩu mới cho tài khoản của bạn.");
  form.hidden = false;
} else if (type === "signup" || type === "email_change" || type === "magiclink" || token) {
  say("Đã xác nhận email thành công. Bạn hãy quay lại ứng dụng Vụ Lúa và đăng nhập.", "ok");
} else {
  say("Trang này dùng để xác nhận email và đặt lại mật khẩu. Hãy mở từ liên kết trong email.");
}

form.addEventListener("submit", function (e) {
  e.preventDefault();
  var pw = document.getElementById("pw").value;
  var btn = document.getElementById("btn");
  if (pw.length < 6) { say("Mật khẩu cần ít nhất 6 ký tự.", "err"); return; }
  btn.disabled = true;
  fetch(SUPABASE_URL + "/auth/v1/user", {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ password: pw })
  }).then(function (r) {
    return r.json().then(function (j) { return { ok: r.ok, body: j }; });
  }).then(function (res) {
    if (res.ok) {
      form.hidden = true;
      history.replaceState(null, "", location.pathname); // xóa mã khỏi thanh địa chỉ
      say("Đã đổi mật khẩu. Hãy quay lại ứng dụng Vụ Lúa và đăng nhập bằng mật khẩu mới.", "ok");
    } else {
      btn.disabled = false;
      say((res.body && (res.body.msg || res.body.message)) || "Không đổi được mật khẩu, hãy thử lại.", "err");
    }
  }).catch(function () {
    btn.disabled = false;
    say("Không kết nối được. Kiểm tra mạng và thử lại.", "err");
  });
});
</script>
</body>
</html>
